name: Backend basic CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/BuildMind.API/BuildMind.API.csproj --configuration Release
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r python-services/requirements-dev.txt
      - run: cd python-services && python -m pytest -q
